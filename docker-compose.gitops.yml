name: planilha-roberta-canary

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: planilha-roberta:gitops-canary
    container_name: planilha-roberta-v2
    restart: unless-stopped
    ports:
      - "3014:8501"
    networks:
      - npm_default

networks:
  npm_default:
    external: true
